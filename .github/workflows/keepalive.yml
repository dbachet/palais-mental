# Un projet Supabase gratuit se met en pause après 7 jours sans activité.
# Cette tâche lit une ligne deux fois par semaine pour l'éviter (vacances…).
# L'adresse et la clé publique sont lues dans js/config.js.
# GitHub suspend les tâches planifiées d'un dépôt sans commit depuis 60 jours :
# un mail prévient, un clic dans l'onglet Actions les relance.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire une ligne
        run: |
          URL=$(sed -n "s/^ *url: *'\([^']*\)'.*/\1/p" js/config.js)
          KEY=$(sed -n "s/^ *key: *'\([^']*\)'.*/\1/p" js/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "js/config.js est vide : rien à faire."
            exit 0
          fi
          curl --fail --silent --show-error \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "${URL%/}/rest/v1/palaces?select=version&limit=1"
